<!DOCTYPE html>
<html>

<head>
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>

<body>

<h1>calculator</h1>

<div class="container">

    <label>Value A</label>
    <input type="number" id="aField">

    <label>Value B</label>
    <input type="number" id="bField">

    <div class="buttonGrid">
        <button id="addBtn">+</button>
        <button id="subBtn">-</button>
        <button id="mulBtn">×</button>
        <button id="divBtn">÷</button>
        <button id="modBtn">%</button>
    </div>

    <hr>

    <button id="rectBtn">Rectangle Area</button>

    <button id="triBtn">Triangle Area</button>

    <button id="randBtn">Random Number</button>

    <h2 id="resultBox">
        Result will appear here.
    </h2>

</div>

</body>
</html>
