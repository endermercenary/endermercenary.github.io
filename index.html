<!DOCTYPE html>
<html>

<head>
    <title>Challenge 12B</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>

<body>

<h1>Guessing Game</h1>

<div class="container">

    <p>Guess the hidden number!</p>

    <h2>

        <label id="smaller">0</label>

        &lt;

        <input type="number" id="guessField">

        &lt;

        <label id="bigger">100</label>

    </h2>

    <button id="btnGuess">Guess</button>

    <button id="btnRestart">Restart</button>

    <h2 id="commentsBox">
        Enter your first guess!
    </h2>

</div>

</body>
</html>
